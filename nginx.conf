server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los Excel se procesan en el navegador, pero se deja margen por si más adelante se suben al servidor.
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # index.html y los datos base siempre frescos; JS y CSS con caché corta.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /data/        { add_header Cache-Control "no-cache"; }
    location ~* \.(js|css)$ { add_header Cache-Control "public, max-age=3600"; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
