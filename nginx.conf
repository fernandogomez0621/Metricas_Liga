server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los Excel se procesan en el navegador, pero se deja margen por si más adelante se suben al servidor.
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Sin caché fuerte: tras actualizar, el navegador recoge siempre la versión nueva.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /data/        { add_header Cache-Control "no-cache"; }
    location ~* \.(js|css)$ { add_header Cache-Control "no-cache"; }

    # API (contenedor "api" del docker compose)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        client_max_body_size 100m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
